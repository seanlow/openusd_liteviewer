<body>
  <h1>OpenUSD Stage Viewer</h1>
  <p id="status">Initializing OpenUSD…</p>

  <main class="layout">
    <section>
      <h2>Viewport</h2>
      <div id="viewport"></div>
    </section>

    <aside>
      <h2>Stage hierarchy</h2>
      <div id="hierarchy" class="hierarchy">Loading...</div>

      <h2>Selected prim</h2>
      <pre id="prim-details">Select a prim to inspect it.</pre>

      <h2>Render payload</h2>
      <pre id="output">Waiting…</pre>
    </aside>
  </main>

  <style>
    body {
      margin: 24px;
      font: 14px/1.5 system-ui, sans-serif;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      gap: 20px;
    }

    #viewport {
      height: 520px;
      background: #202630;
      border-radius: 8px;
      overflow: hidden;
    }

    #viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hierarchy {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 260px;
      overflow: auto;
      padding: 8px;
      background: #f1f3f5;
      border-radius: 6px;
    }

    .prim-row {
      display: flex;
      gap: 8px;
      align-items: baseline;
      width: 100%;
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      text-align: left;
      font: inherit;
      color: #202630;
      background: transparent;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .prim-row:hover, .prim-row[aria-pressed="true"] {
      background: #d9e8fb;
    }

    .prim-type {
      color: #5b6572;
      font-size: 12px;
      margin-left: auto;
      flex-shrink: 0;
    }

    pre {
      padding: 12px;
      background: #f1f3f5;
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script src="./usd-webview-bindings/usdWebViewBindings.js"></script>
  <script type="module" src="./test.js"></script>
</body>
