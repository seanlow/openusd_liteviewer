<body>
  <h1>OpenUSD Stage Viewer</h1>
  <p id="status">Initializing OpenUSD…</p>

  <main class="layout">
    <section>
      <h2>Viewport</h2>
      <div id="viewport"></div>
    </section>

    <aside>
      <h2>Stage hierarchy</h2>
      <pre id="hierarchy">Loading...</pre>

      <h2>Render payload</h2>
      <pre id="output">Waiting…</pre>
    </aside>
  </main>

  <style>
    body {
      margin: 24px;
      font: 14px/1.5 system-ui, sans-serif;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      gap: 20px;
    }

    #viewport {
      height: 520px;
      background: #202630;
      border-radius: 8px;
      overflow: hidden;
    }

    #viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    pre {
      padding: 12px;
      background: #f1f3f5;
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script src="./usd-webview-bindings/usdWebViewBindings.js"></script>
  <script type="module" src="./test.js"></script>
</body>
